name: build-platform-binaries

# Build platform-specific binaries and attach them to a GitHub Release.
# Triggered by pushing a tag matching v*. The release is created if it does
# not exist yet (matching the goreleaser workflow's convention for this repo).
#
# Targets:
#   - windows-2019 amd64  -> CLIProxyAPI-windows-amd64.exe
#   - ubuntu-latest amd64 -> CLIProxyAPI-linux-amd64
#   - ubuntu-24.04-arm64  -> CLIProxyAPI-linux-arm64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger: builds binaries and uploads them as workflow artifacts
    # only. No release is created — use the tag-push trigger for that.
    inputs:
      tag_name:
        description: 'Build label (for the artifact names and run summary)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:
              os: windows
              arch: amd64
              ext: .exe
              asset: CLIProxyAPI-windows-amd64.exe
            runner: windows-2019
            goos: windows
            goarch: amd64
            cgo: '0'
          - target:
              os: linux
              arch: amd64
              ext: ''
              asset: CLIProxyAPI-linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: '1'
          - target:
              os: linux
              arch: arm64
              ext: ''
              asset: CLIProxyAPI-linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}-{1}', inputs.tag_name, github.event.run_number) || github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: |
          set -euo pipefail
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT}' -X 'main.BuildDate=${BUILD_DATE}'" \
            -o "CLIProxyAPI${{ matrix.target.ext }}" \
            ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.asset }}
          path: CLIProxyAPI${{ matrix.target.ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release assets
    # Only auto-publish to GitHub Releases when triggered by a tag push.
    # workflow_dispatch runs leave binaries as workflow artifacts (14-day
    # retention) for ad-hoc downloads without polluting the Releases page.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/CLIProxyAPI-windows-amd64.exe
            dist/CLIProxyAPI-linux-amd64
            dist/CLIProxyAPI-linux-arm64
            dist/checksums.txt