api-keys:
- sk-test-cpa-patched-key   # 这是CPA的 api key
auth-dir: /home/ubuntu/.cli-proxy-api-patched
commercial-mode: false
debug: false
error-logs-max-files: 20
force-model-prefix: false
host: 127.0.0.1
logging-to-file: true
logs-max-total-size-mb: 0
max-retry-credentials: 0
max-retry-interval: 30
nonstream-keepalive-interval: 0
openai-compatibility:
- api-key-entries:
  - api-key: sk-agentrouter-org-api-key # 这是agentrouter的 api key
  base-url: https://agentrouter.org
  disabled: false
  headers:
    User-Agent: Kilo-Code/7.3.50 ai-sdk/provider-utils/4.0.27 runtime/bun/1.3.14 # 这是自定义header
  models:
  - alias: deepseek-v4-flash
    name: deepseek-v4-flash
  name: agentrouter
  request-format: anthropic  # 新增功能
passthrough-headers: false
port: 8328
pprof:
  addr: 127.0.0.1:8327
  enable: false
proxy-url: ''
quota-exceeded:
  switch-preview-model: false
  switch-project: false
remote-management:
  allow-remote: false
  disable-control-panel: true
  secret-key: ''
request-retry: 0
routing:
  strategy: round-robin
tls:
  cert: ''
  enable: false
  key: ''
usage-statistics-enabled: false
ws-auth: false
